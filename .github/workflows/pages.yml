name: Deploy web version to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The site is served from /unspoken/, so point the bundle and assets there.
      - run: node -e "const f='app.json',c=require('./'+f);c.expo.experiments={...c.expo.experiments,baseUrl:'/unspoken'};require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
      - run: pnpm build:web
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/mobile/dist
      - id: deployment
        uses: actions/deploy-pages@v4
