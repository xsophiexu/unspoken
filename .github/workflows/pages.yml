name: Redirect GitHub Pages to Firebase Hosting

# The web version now lives on Firebase Hosting (firebase-hosting.yml). This keeps the old
# https://<owner>.github.io/unspoken/ address working by publishing a page that forwards every path there.

on:
  push:
    branches: [main]
    paths: ['.github/pages-redirect/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .github/pages-redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
