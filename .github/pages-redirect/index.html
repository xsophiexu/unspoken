<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unspoken has moved</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://unspokengame.web.app/">
<meta http-equiv="refresh" content="0; url=https://unspokengame.web.app/">
<script>
  // Keep the page path, query and hash: /unspoken/how-to-play/?x#y -> https://unspokengame.web.app/how-to-play/?x#y
  var path = location.pathname.replace(/^\/unspoken(?=\/|$)/, '') || '/';
  location.replace('https://unspokengame.web.app' + path + location.search + location.hash);
</script>
</head>
<body>
<p>Unspoken has moved to <a href="https://unspokengame.web.app/">unspokengame.web.app</a>.</p>
</body>
</html>
